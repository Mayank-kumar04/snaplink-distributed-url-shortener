version: '3.8'

services:
  # PostgreSQL - our persistent database
  postgres:
    image: postgres:15-alpine
    container_name: snaplink_postgres
    environment:
      POSTGRES_USER: snaplink
      POSTGRES_PASSWORD: snaplink123
      POSTGRES_DB: snaplink
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snaplink"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis - our cache layer
  redis:
    image: redis:7-alpine
    container_name: snaplink_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes  # persist data to disk
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
